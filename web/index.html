<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RCX Env Launcher</title>
  <script>
    // Apply the saved theme + glass mode before first paint (no flash).
    // Theme (auto/light/dark) and glass (on/off) are independent: glass is a
    // frosted overlay that layers on top of whichever theme is active.
    (function () {
      var TKEY = "rcx-theme", GKEY = "rcx-glass";
      var root = document.documentElement;
      function resolve(choice) {
        if (choice === "light" || choice === "dark") return choice;
        return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      function themeChoice() {
        try { return localStorage.getItem(TKEY) || "auto"; } catch (e) { return "auto"; }
      }
      function glassOn() {
        try { return localStorage.getItem(GKEY) === "on"; } catch (e) { return false; }
      }
      window.__themeChoice = themeChoice;
      window.__glassOn = glassOn;
      window.__applyTheme = function (choice) {
        try { if (choice) localStorage.setItem(TKEY, choice); } catch (e) { /* private mode */ }
        root.setAttribute("data-theme", resolve(choice || themeChoice()));
      };
      window.__applyGlass = function (on) {
        try { localStorage.setItem(GKEY, on ? "on" : "off"); } catch (e) { /* private mode */ }
        if (on) root.setAttribute("data-glass", "on");
        else root.removeAttribute("data-glass");
      };
      root.setAttribute("data-theme", resolve(themeChoice()));
      if (glassOn()) root.setAttribute("data-glass", "on");
      // React to OS changes while the theme is on "auto".
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        if (themeChoice() === "auto") root.setAttribute("data-theme", resolve("auto"));
      });
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">RCX</span>
      <span class="title">Env Launcher</span>
    </div>
    <input id="filter" type="search" placeholder="Filter clients, envs, links…  (/ to focus)" autocomplete="off">
    <div class="actions">
      <div id="status" class="status" title="Active VPNs"></div>
      <button id="sync" class="btn-ghost" title="Pull the latest links from the wiki and reload">Sync</button>
    </div>
  </header>

  <nav id="nav" class="clientnav"></nav>

  <main id="main" class="main">
    <div id="loading" class="empty">Loading…</div>
  </main>

  <div id="toasts" class="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
